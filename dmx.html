<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DMX Light Control</title>

  <style>
    :root {
      --bg: #09070d;
      --panel: #121019;
      --border: #2b2435;
      --text: #f5f1fa;
      --muted: #9d95a8;
      --accent: #9d4edd;
      --accent-2: #c77dff;
      --danger: #ff5577;
      --shadow: 0 12px 35px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      padding: 8px;
    }

    .topbar {
      width: 100%;
      min-height: 60px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 9px 12px;

      background: rgba(18, 16, 25, .96);
      border: 1px solid var(--border);
      border-radius: 16px;

      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 50%;

      background:
        radial-gradient(
          circle at 50% 45%,
          #fff 0%,
          #e6bfff 18%,
          #9d4edd 45%,
          #4c176f 72%,
          #190b27 100%
        );

      box-shadow:
        0 0 12px rgba(199, 125, 255, .7),
        0 0 28px rgba(157, 78, 221, .35);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 1px;
      font-size: 10px;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn {
      border: 1px solid var(--border);
      background: #18141e;

      padding: 8px 12px;
      border-radius: 10px;

      cursor: pointer;

      transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease;
    }

    .btn:hover {
      background: #211a29;
      border-color: #473755;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(
        135deg,
        #7b2cbf,
        #9d4edd
      );

      border-color: #b76be8;
    }

    .btn-danger {
      color: #ff9ab0;
      border-color: rgba(255, 85, 119, .25);
    }

    .btn-danger:hover {
      background: rgba(255, 85, 119, .08);
    }

    .icon-btn {
      width: 37px;
      height: 37px;
      padding: 0;
      display: grid;
      place-items: center;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;

      padding: 7px 9px;

      color: var(--muted);
      font-size: 10px;

      border: 1px solid var(--border);
      border-radius: 9px;
      background: #0f0c14;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #777;
    }

    .status.connected .status-dot {
      background: #52e07d;
      box-shadow: 0 0 9px rgba(82, 224, 125, .7);
    }

    /* MASTER */

    .master-panel {
      margin-top: 9px;

      padding: 12px 14px;

      display: flex;
      align-items: center;
      gap: 18px;

      background: rgba(18, 16, 25, .96);
      border: 1px solid var(--border);
      border-radius: 15px;

      box-shadow: var(--shadow);
    }

    .master-info {
      width: 135px;
      flex: 0 0 auto;
    }

    .master-title {
      font-size: 12px;
      font-weight: 800;
    }

    .master-subtitle {
      margin-top: 2px;
      font-size: 10px;
      color: var(--muted);
    }

    .master-control {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .master-value {
      width: 42px;
      text-align: right;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-2);
    }

    /* SLIDERS */

    input[type="range"] {
      width: 100%;
      height: 5px;

      appearance: none;
      -webkit-appearance: none;

      border-radius: 20px;
      outline: none;

      background:
        linear-gradient(
          90deg,
          #7b2cbf,
          #c77dff
        );
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #fff;
      border: 3px solid #a957df;

      box-shadow:
        0 0 10px rgba(199, 125, 255, .5);

      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #fff;
      border: 3px solid #a957df;

      cursor: pointer;
    }

    /* STAGE */

    .stage-wrap {
      margin-top: 9px;
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 7px;
      padding: 0 3px;
    }

    .stage-title {
      font-size: 11px;
      font-weight: 800;
    }

    .stage-hint {
      font-size: 9px;
      color: var(--muted);
    }

    .stage {
      position: relative;

      width: 100%;
      min-height: 650px;

      overflow: hidden;

      border-radius: 16px;
      border: 1px solid var(--border);

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(157, 78, 221, .09),
          transparent 34%
        ),
        linear-gradient(
          rgba(255, 255, 255, .018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, .018) 1px,
          transparent 1px
        ),
        #0d0a12;

      background-size:
        auto,
        40px 40px,
        40px 40px,
        auto;

      box-shadow: var(--shadow);
    }

    /* FIXTURE */

    .fixture {
      position: absolute;

      width: 150px;

      padding: 9px;

      border-radius: 16px;

      background: rgba(20, 17, 27, .96);
      border: 1px solid #302839;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, .32);

      user-select: none;
      cursor: grab;

      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    .fixture:active {
      cursor: grabbing;
    }

    .fixture:hover {
      border-color: #493958;
    }

    .fixture-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;

      margin-bottom: 7px;
    }

    .fixture-name {
      font-size: 10px;
      font-weight: 800;
    }

    .fixture-address {
      font-size: 8px;
      color: var(--accent-2);
      font-family: monospace;
      white-space: nowrap;
    }

    /* PAR LAMP */

    .lamp-area {
      display: flex;
      justify-content: center;
      align-items: center;

      padding: 3px 0 9px;
    }

    .lamp {
      position: relative;

      width: 72px;
      height: 72px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 50% 45%,
          #fff 0%,
          var(--lamp-color, #c77dff) 17%,
          var(--lamp-color, #c77dff) 32%,
          #351444 55%,
          #110b17 76%,
          #07050a 100%
        );

      border: 3px solid rgba(255, 255, 255, .12);

      box-shadow:
        0 0 8px var(--lamp-color, #c77dff),
        0 0 20px rgba(157, 78, 221, .25),
        inset 0 0 14px rgba(255, 255, 255, .16);

      transition:
        filter .08s linear,
        transform .15s ease;
    }

    .lamp::before {
      content: "";

      position: absolute;
      inset: 8px;

      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .22);
    }

    .lamp::after {
      content: "";

      position: absolute;

      width: 17px;
      height: 10px;

      left: 15px;
      top: 12px;

      border-radius: 50%;

      background: rgba(255, 255, 255, .48);

      filter: blur(3px);

      transform: rotate(-25deg);
    }

    /* COLOR BUTTONS */

    .color-buttons {
      display: flex;
      justify-content: center;
      gap: 6px;

      margin-bottom: 8px;
    }

    .color-btn {
      width: 19px;
      height: 19px;

      padding: 0;

      border-radius: 50%;

      border: 2px solid rgba(255, 255, 255, .15);

      cursor: pointer;

      transition:
        transform .12s ease,
        border-color .12s ease,
        box-shadow .12s ease;
    }

    .color-btn:hover {
      transform: scale(1.15);
      border-color: rgba(255, 255, 255, .7);
    }

    .color-btn.active {
      border-color: #fff;

      box-shadow:
        0 0 7px currentColor,
        0 0 13px currentColor;
    }

    /* DIMMER */

    .fixture-dimmer {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .fixture-dimmer-icon {
      font-size: 10px;
      color: var(--muted);
    }

    .fixture-dimmer-value {
      width: 28px;

      text-align: right;

      font-size: 8px;
      color: var(--muted);
    }

    /* ADDRESS INPUT */

    .address-row {
      display: flex;
      align-items: center;
      gap: 7px;

      margin-top: 8px;
      padding-top: 7px;

      border-top: 1px solid rgba(255, 255, 255, .05);
    }

    .address-label {
      font-size: 8px;
      color: var(--muted);
      white-space: nowrap;
    }

    .address-input {
      width: 100%;

      min-width: 0;

      padding: 4px 6px;

      color: var(--text);
      background: #0c0910;

      border: 1px solid #2d2635;
      border-radius: 6px;

      font-family: monospace;
      font-size: 9px;

      outline: none;
    }

    .address-input:focus {
      border-color: #8750ae;
    }

    /* GENERIC DIMMER */

    .dimmer-icon {
      width: 57px;
      height: 57px;

      margin: 3px auto 8px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 50% 45%,
          #fff 0%,
          #e5d9ec 8%,
          #9d4edd 27%,
          #351444 58%,
          #0a070d 100%
        );

      box-shadow:
        0 0 14px rgba(157, 78, 221, .4),
        inset 0 0 10px rgba(255, 255, 255, .12);

      font-size: 19px;
    }

    .dimmer-label {
      text-align: center;

      margin-bottom: 8px;

      font-size: 9px;
      color: var(--muted);
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 15px;

      background: rgba(0, 0, 0, .68);
      backdrop-filter: blur(7px);

      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(460px, 100%);

      background: #131019;

      border: 1px solid #342b3e;
      border-radius: 19px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, .6);

      overflow: hidden;
    }

    .scheme-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
      padding: 9px 10px;
      background: rgba(18, 16, 25, .96);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }

    .scheme-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 6px 8px;
      color: var(--muted);
      background: #18141e;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 10px;
    }

    .scheme-button.active {
      color: var(--text);
      border-color: var(--accent-2);
      box-shadow: 0 0 0 1px rgba(199, 125, 255, .25);
    }

    .scheme-swatches {
      display: flex;
      gap: 2px;
    }

    .scheme-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .25);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 16px 17px;

      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 14px;
      font-weight: 800;
    }

    .modal-body {
      padding: 17px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;

      margin-bottom: 6px;

      font-size: 10px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;

      padding: 9px 10px;

      color: var(--text);
      background: #0d0a11;

      border: 1px solid var(--border);
      border-radius: 9px;

      outline: none;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;

      padding: 13px 17px;

      border-top: 1px solid var(--border);
    }

    .modal-footer-right {
      display: flex;
      gap: 7px;
    }

    @media (max-width: 700px) {

      .app {
        padding: 6px;
      }

      .brand-subtitle,
      .status {
        display: none;
      }

      .master-panel {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .master-info {
        width: 100%;
      }

      .master-control {
        width: 100%;
      }

      .stage {
        min-height: 720px;
      }

      .fixture {
        width: 140px;
      }
    }

    @media (max-width: 460px) {

      .brand-title {
        font-size: 14px;
      }

      .btn {
        padding: 8px 9px;
        font-size: 10px;
      }

      .fixture {
        width: 132px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="brand">

      <div class="brand-icon"></div>

      <div>
        <div class="brand-title">
          DMX Light Control
        </div>

        <div class="brand-subtitle">
          Browser lighting controller
        </div>
      </div>

    </div>

    <div class="top-actions">

      <div
        class="status"
        id="connectionStatus"
      >
        <span class="status-dot"></span>
        <span id="statusText">
          Niet verbonden
        </span>
      </div>

      <button
        class="btn btn-primary"
        id="connectBtn"
      >
        Verbinden
      </button>

      <button
        class="btn icon-btn"
        id="settingsBtn"
        title="Instellingen"
      >
        ⚙
      </button>

    </div>

  </header>


  <!-- MASTER -->

  <section class="master-panel">

    <div class="master-info">

      <div class="master-title">
        Master dimmer
      </div>

      <div class="master-subtitle">
        Algemene helderheid
      </div>

    </div>

    <div class="master-control">

      <input
        id="masterSlider"
        type="range"
        min="0"
        max="100"
        value="100"
      >

      <div
        class="master-value"
        id="masterValue"
      >
        100%
      </div>

    </div>

  </section>


  <!-- STAGE -->

  <main class="stage-wrap">

    <div class="stage-header">

      <div class="stage-title">
        Lichtplan
      </div>

      <div class="stage-hint">
        Sleep lampen om ze te verplaatsen
      </div>

    </div>

    <div
      class="stage"
      id="stage"
    ></div>

    <div
      class="scheme-bar"
      id="schemePicker"
      aria-label="Kleurenschema kiezen"
    ></div>

  </main>

</div>


<!-- SETTINGS -->

<div
  class="modal-backdrop"
  id="settingsModal"
>

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">
        Instellingen
      </div>

      <button
        class="btn icon-btn"
        id="closeSettingsBtn"
      >
        ×
      </button>

    </div>

    <div class="modal-body">

      <div class="field">

        <label for="parCount">
          Aantal Compact Par 7 Tri
        </label>

        <input
          id="parCount"
          type="number"
          min="0"
          max="30"
        >

      </div>

      <div class="field">

        <label for="dimmerCount">
          Aantal dimmers
        </label>

        <input
          id="dimmerCount"
          type="number"
          min="0"
          max="32"
        >

      </div>

      <div class="field">

        <label for="scheme">
          Kleurenschema
        </label>

        <select id="scheme">

          <option value="deepWorship">
            Deep Worship
          </option>

          <option value="oceanWorship">
            Ocean Worship
          </option>

          <option value="purpleGold">
            Purple &amp; Gold
          </option>

          <option value="earthSky">
            Earth &amp; Sky
          </option>

          <option value="modernWorship">
            Modern Worship
          </option>

        </select>

      </div>

      <div class="field">

        <label for="frameInterval">
          DMX frame-interval (ms)
        </label>

        <input
          id="frameInterval"
          type="number"
          min="25"
          max="5000"
          step="25"
        >

      </div>

    </div>

    <div class="modal-footer">

      <button
        class="btn btn-danger"
        id="resetBtn"
      >
        Reset app
      </button>

      <div class="modal-footer-right">

        <button
          class="btn"
          id="cancelSettingsBtn"
        >
          Annuleren
        </button>

        <button
          class="btn btn-primary"
          id="saveSettingsBtn"
        >
          Opslaan
        </button>

      </div>

    </div>

  </div>

</div>


<script src="dmx.js"></script>

<script>

const STORAGE_KEY =
  "simple-dmx-control-v5";


const COLOR_SCHEMES = {

  deepWorship: [
    "#5B2A86",
    "#2457A6",
    "#159A9C",
    "#F2A93B",
    "#FFF1D0"
  ],

  oceanWorship: [
    "#312E81",
    "#2563EB",
    "#06B6D4",
    "#14B8A6",
    "#F8FAFC"
  ],

  purpleGold: [
    "#4C1D95",
    "#7C3AED",
    "#C026D3",
    "#F59E0B",
    "#FFF7E6"
  ],

  earthSky: [
    "#1E3A5F",
    "#3B82C4",
    "#3A8F6B",
    "#D99A2B",
    "#FFF4DC"
  ],

  modernWorship: [
    "#172554",
    "#6D28D9",
    "#DB2777",
    "#F97316",
    "#FFFFFF"
  ]

};


const LEGACY_SCHEMES = {
  purple: [
    "#3c096c",
    "#5a189a",
    "#7b2cbf",
    "#9d4edd",
    "#c77dff"
  ],
  party: [
    "#ff355d",
    "#ff9f1c",
    "#fff133",
    "#32e875",
    "#6c63ff"
  ],
  sunset: [
    "#ff4d6d",
    "#ff7b00",
    "#ffb703",
    "#fb5607",
    "#8338ec"
  ],
  ocean: [
    "#00b4d8",
    "#0077b6",
    "#48cae4",
    "#4361ee",
    "#4cc9f0"
  ],
  forest: [
    "#2d6a4f",
    "#40916c",
    "#52b788",
    "#95d5b2",
    "#b7e4c7"
  ],
  pastel: [
    "#ffadad",
    "#ffd6a5",
    "#fdffb6",
    "#caffbf",
    "#bdb2ff"
  ],
  mono: [
    "#ffffff",
    "#c7c7c7",
    "#929292",
    "#5e5e5e",
    "#303030"
  ]
};


let state = {

  parCount: 4,

  dimmerCount: 4,

  scheme: "deepWorship",

  master: 100,

  frameInterval: 1000,

  pars: [],

  dimmers: []

};


/*
  dmx.js gebruikt deze functie.
*/

window.getDMXState =
  () => state;


const stage =
  document.getElementById("stage");

const masterSlider =
  document.getElementById("masterSlider");

const masterValue =
  document.getElementById("masterValue");

const settingsModal =
  document.getElementById("settingsModal");

const settingsBtn =
  document.getElementById("settingsBtn");

const closeSettingsBtn =
  document.getElementById("closeSettingsBtn");

const cancelSettingsBtn =
  document.getElementById("cancelSettingsBtn");

const saveSettingsBtn =
  document.getElementById("saveSettingsBtn");

const resetBtn =
  document.getElementById("resetBtn");

const parCountInput =
  document.getElementById("parCount");

const dimmerCountInput =
  document.getElementById("dimmerCount");

const frameIntervalInput =
  document.getElementById("frameInterval");

const schemeInput =
  document.getElementById("scheme");

const schemePicker =
  document.getElementById("schemePicker");

const connectBtn =
  document.getElementById("connectBtn");

const connectionStatus =
  document.getElementById("connectionStatus");

const statusText =
  document.getElementById("statusText");


/* LOAD */

function loadState() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (saved) {

      state = {
        ...state,
        ...JSON.parse(saved)
      };

    }

  } catch (error) {

    console.error(
      "State laden mislukt:",
      error
    );

  }

  if (!COLOR_SCHEMES[state.scheme]) {

    switchColorScheme(
      "deepWorship",
      false
    );

  }

  ensureFixtures();

  state.frameInterval = clamp(
    Number(state.frameInterval) || 1000,
    25,
    5000
  );

}


function getSchemeColors(scheme) {

  if (LEGACY_SCHEMES[scheme]) {
    return LEGACY_SCHEMES[scheme];
  }

  return COLOR_SCHEMES[scheme] ||
    COLOR_SCHEMES.deepWorship;

}


function switchColorScheme(newScheme, shouldRender = true) {

  if (!COLOR_SCHEMES[newScheme]) {
    newScheme = "deepWorship";
  }

  const oldColors =
    getSchemeColors(state.scheme);

  const newColors =
    COLOR_SCHEMES[newScheme];

  state.pars.forEach(par => {

    const oldColor =
      String(par.color).toLowerCase();

    let colorIndex =
      oldColors.findIndex(
        color => color.toLowerCase() === oldColor
      );

    if (colorIndex < 0 || colorIndex >= newColors.length) {
      colorIndex = 0;
    }

    par.color = newColors[colorIndex];

  });

  state.scheme = newScheme;

  if (schemeInput) {
    schemeInput.value = newScheme;
  }

  if (shouldRender) {
    saveState();
    render();
  }

}


function renderSchemePicker() {

  const labels = {
    deepWorship: "Deep Worship",
    oceanWorship: "Ocean Worship",
    purpleGold: "Purple & Gold",
    earthSky: "Earth & Sky",
    modernWorship: "Modern Worship"
  };

  schemePicker.innerHTML = "";

  Object.entries(COLOR_SCHEMES).forEach(
    ([scheme, colors]) => {

      const button =
        document.createElement("button");

      button.type = "button";
      button.className = "scheme-button";
      button.classList.toggle(
        "active",
        scheme === state.scheme
      );
      button.title = labels[scheme];
      button.setAttribute(
        "aria-label",
        labels[scheme]
      );

      const swatches =
        document.createElement("span");

      swatches.className = "scheme-swatches";

      colors.forEach(color => {

        const swatch =
          document.createElement("span");

        swatch.className = "scheme-swatch";
        swatch.style.background = color;
        swatches.appendChild(swatch);

      });

      button.appendChild(swatches);
      button.appendChild(
        document.createTextNode(labels[scheme])
      );

      button.addEventListener("click", () => {
        switchColorScheme(scheme);
      });

      schemePicker.appendChild(button);

    }
  );

}


function setDMXFrameInterval(milliseconds) {

  if (
    window.dmx &&
    typeof window.dmx.setFrameInterval === "function"
  ) {

    window.dmx.setFrameInterval(milliseconds);

  }

}


function startSliderInteraction() {

  setDMXFrameInterval(
    Math.min(
      5000,
      state.frameInterval * 2
    )
  );

}


function stopSliderInteraction() {

  setDMXFrameInterval(
    state.frameInterval
  );

}


function addSliderIntervalHandlers(slider) {

  slider.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

      startSliderInteraction();

    }
  );

  slider.addEventListener(
    "pointerup",
    stopSliderInteraction
  );

  slider.addEventListener(
    "pointercancel",
    stopSliderInteraction
  );

}


/* SAVE */

function saveState() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );

  } catch (error) {

    console.error(
      "State opslaan mislukt:",
      error
    );

  }

}


/* ENSURE FIXTURES */

function ensureFixtures() {

  const colors =
    getSchemeColors(state.scheme);


  for (
    let i = 0;
    i < state.parCount;
    i++
  ) {

    if (!state.pars[i]) {

      state.pars[i] = {

        /*
          Standaard 4 kanalen per PAR.
        */

        address:
          i * 4 + 1,

        color:
          colors[0],

        dimmer:
          100,

        x:
          20 + (i % 6) * 170,

        y:
          25 +
          Math.floor(i / 6) * 210

      };

    }


    /*
      Compatibiliteit met oudere
      opgeslagen instellingen.
    */

    if (
      !Number.isFinite(
        Number(state.pars[i].address)
      )
    ) {

      state.pars[i].address =
        i * 4 + 1;

    }

  }


  state.pars =
    state.pars.slice(
      0,
      state.parCount
    );


  for (
    let i = 0;
    i < state.dimmerCount;
    i++
  ) {

    if (!state.dimmers[i]) {

      state.dimmers[i] = {

        address:
          state.parCount * 4 + i + 1,

        dimmer:
          100,

        x:
          20 + (i % 6) * 180,

        y:
          330 +
          Math.floor(i / 6) * 170

      };

    }

    if (
      !Number.isFinite(
        Number(state.dimmers[i].address)
      )
    ) {

      state.dimmers[i].address =
        state.parCount * 4 + i + 1;

    }

  }


  state.dimmers =
    state.dimmers.slice(
      0,
      state.dimmerCount
    );

}


/* CLAMP */

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(max, value)
  );

}


/* SET MASTER */

function setMaster(value) {

  state.master =
    clamp(
      Number(value),
      0,
      100
    );

  masterSlider.value =
    state.master;

  masterValue.textContent =
    `${state.master}%`;

  saveState();

}


/* RENDER */

function render() {

  ensureFixtures();

  stage.innerHTML = "";

  renderSchemePicker();


  masterSlider.value =
    state.master;

  masterValue.textContent =
    `${state.master}%`;


  state.pars.forEach(
    (par, index) => {

      stage.appendChild(
        createPar(
          index,
          par
        )
      );

    }
  );


  state.dimmers.forEach(
    (dimmer, index) => {

      stage.appendChild(
        createDimmer(
          index,
          dimmer
        )
      );

    }
  );

}


/* CREATE PAR */

function createPar(
  index,
  par
) {

  const fixture =
    document.createElement("div");

  fixture.className =
    "fixture";

  fixture.style.left =
    `${par.x}px`;

  fixture.style.top =
    `${par.y}px`;


  const head =
    document.createElement("div");

  head.className =
    "fixture-head";


  const name =
    document.createElement("div");

  name.className =
    "fixture-name";

  name.textContent =
    `PAR ${index + 1}`;


  const address =
    document.createElement("div");

  address.className =
    "fixture-address";

  address.textContent =
    `DMX ${par.address}`;


  head.appendChild(name);
  head.appendChild(address);


  /*
    Lamp
  */

  const lampArea =
    document.createElement("div");

  lampArea.className =
    "lamp-area";


  const lamp =
    document.createElement("div");

  lamp.className =
    "lamp";

  lamp.style.setProperty(
    "--lamp-color",
    par.color
  );


  updateLampVisual(
    lamp,
    par
  );


  lampArea.appendChild(
    lamp
  );


  /*
    Colors
  */

  const colorButtons =
    document.createElement("div");

  colorButtons.className =
    "color-buttons";


  const colors =
    getSchemeColors(state.scheme);


  colors.forEach(
    (color) => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "color-btn";

      button.style.background =
        color;

      button.style.color =
        color;


      if (
        String(par.color).toLowerCase() ===
        color.toLowerCase()
      ) {

        button.classList.add(
          "active"
        );

      }


      button.addEventListener(
        "pointerdown",
        event => {

          event.stopPropagation();

        }
      );


      button.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          par.color =
            color;

          lamp.style.setProperty(
            "--lamp-color",
            color
          );

          colorButtons
            .querySelectorAll(
              ".color-btn"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          saveState();

        }
      );


      colorButtons.appendChild(
        button
      );

    }
  );


  /*
    PAR dimmer
  */

  const dimmer =
    document.createElement("div");

  dimmer.className =
    "fixture-dimmer";


  const dimmerIcon =
    document.createElement("span");

  dimmerIcon.className =
    "fixture-dimmer-icon";

  dimmerIcon.textContent =
    "☀";


  const slider =
    document.createElement("input");

  slider.type =
    "range";

  slider.min =
    "0";

  slider.max =
    "100";

  slider.value =
    par.dimmer;


  const value =
    document.createElement("span");

  value.className =
    "fixture-dimmer-value";

  value.textContent =
    `${par.dimmer}%`;


  slider.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

    }
  );

  addSliderIntervalHandlers(slider);


  slider.addEventListener(
    "input",
    event => {

      event.stopPropagation();

      par.dimmer =
        Number(slider.value);

      value.textContent =
        `${par.dimmer}%`;

      updateLampVisual(
        lamp,
        par
      );

      saveState();

    }
  );


  dimmer.appendChild(
    dimmerIcon
  );

  dimmer.appendChild(
    slider
  );

  dimmer.appendChild(
    value
  );


  /*
    DMX adres
  */

  const addressRow =
    document.createElement("div");

  addressRow.className =
    "address-row";


  const addressLabel =
    document.createElement("span");

  addressLabel.className =
    "address-label";

  addressLabel.textContent =
    "Adres";


  const addressInput =
    document.createElement("input");

  addressInput.className =
    "address-input";

  addressInput.type =
    "number";

  addressInput.min =
    "1";

  addressInput.max =
    "509";

  addressInput.value =
    par.address;

  addressInput.title =
    "DMX startadres van deze PAR";


  addressInput.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

    }
  );


  addressInput.addEventListener(
    "click",
    event => {

      event.stopPropagation();

    }
  );


  addressInput.addEventListener(
    "input",
    event => {

      event.stopPropagation();

      let newAddress =
        Number(
          addressInput.value
        );


      if (
        !Number.isFinite(newAddress)
      ) {

        return;

      }


      newAddress =
        clamp(
          Math.round(newAddress),
          1,
          509
        );


      par.address =
        newAddress;

      address.textContent =
        `DMX ${newAddress}`;

      saveState();

    }
  );


  addressInput.addEventListener(
    "change",
    event => {

      event.stopPropagation();

      let newAddress =
        clamp(
          Number(addressInput.value),
          1,
          509
        );

      par.address =
        newAddress;

      addressInput.value =
        newAddress;

      address.textContent =
        `DMX ${newAddress}`;

      saveState();

    }
  );


  addressRow.appendChild(
    addressLabel
  );

  addressRow.appendChild(
    addressInput
  );


  fixture.appendChild(head);

  fixture.appendChild(lampArea);

  fixture.appendChild(
    colorButtons
  );

  fixture.appendChild(dimmer);

  fixture.appendChild(
    addressRow
  );


  makeDraggable(
    fixture,
    par
  );


  return fixture;

}


/* LAMP VISUAL */

function updateLampVisual(
  lamp,
  par
) {

  const brightness =
    Math.max(
      0.08,
      Number(par.dimmer) / 100
    );


  lamp.style.filter =
    `brightness(${brightness})`;

}


/* CREATE DIMMER */

function createDimmer(
  index,
  dimmer
) {

  const fixture =
    document.createElement("div");

  fixture.className =
    "fixture";

  fixture.style.left =
    `${dimmer.x}px`;

  fixture.style.top =
    `${dimmer.y}px`;


  const channel = clamp(
    Number(dimmer.address),
    1,
    512
  );


  const head =
    document.createElement("div");

  head.className =
    "fixture-head";

  head.innerHTML = `
    <div class="fixture-name">
      Dimmer ${index + 1}
    </div>

    <div class="fixture-address">
      DMX ${channel}
    </div>
  `;


  const icon =
    document.createElement("div");

  icon.className =
    "dimmer-icon";


  const label =
    document.createElement("div");

  label.className =
    "dimmer-label";

  label.textContent =
    `${dimmer.dimmer}%`;


  updateDimmerVisual(
    icon,
    dimmer
  );


  const slider =
    document.createElement("input");

  slider.type =
    "range";

  slider.min =
    "0";

  slider.max =
    "100";

  slider.value =
    dimmer.dimmer;


  slider.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

    }
  );

  const addressRow =
    document.createElement("div");

  addressRow.className =
    "address-row";

  const addressLabel =
    document.createElement("span");

  addressLabel.className =
    "address-label";

  addressLabel.textContent =
    "Adres";

  const addressInput =
    document.createElement("input");

  addressInput.className =
    "address-input";

  addressInput.type =
    "number";

  addressInput.min =
    "1";

  addressInput.max =
    "512";

  addressInput.value =
    channel;

  addressInput.title =
    "DMX-adres van deze dimmer";

  addressInput.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

    }
  );

  addressInput.addEventListener(
    "click",
    event => {

      event.stopPropagation();

    }
  );

  addressInput.addEventListener(
    "input",
    event => {

      event.stopPropagation();

      dimmer.address = clamp(
        Number(addressInput.value),
        1,
        512
      );

      addressInput.value =
        dimmer.address;

      head.querySelector(
        ".fixture-address"
      ).textContent =
        `DMX ${dimmer.address}`;

      saveState();

    }
  );

  addressRow.appendChild(
    addressLabel
  );

  addressRow.appendChild(
    addressInput
  );

  addSliderIntervalHandlers(slider);


  slider.addEventListener(
    "input",
    event => {

      event.stopPropagation();

      dimmer.dimmer =
        Number(slider.value);

      label.textContent =
        `${dimmer.dimmer}%`;

      updateDimmerVisual(
        icon,
        dimmer
      );

      saveState();

    }
  );


  icon.textContent =
    "☀";


  fixture.appendChild(
    head
  );

  fixture.appendChild(
    icon
  );

  fixture.appendChild(
    label
  );

  fixture.appendChild(
    slider
  );

  fixture.appendChild(
    addressRow
  );


  makeDraggable(
    fixture,
    dimmer
  );


  return fixture;

}


/* DIMMER VISUAL */

function updateDimmerVisual(
  icon,
  dimmer
) {

  const brightness =
    Math.max(
      .2,
      Number(dimmer.dimmer) / 100
    );


  icon.style.filter =
    `brightness(${brightness})`;

}


/* DRAG */

function makeDraggable(
  element,
  fixtureState
) {

  let dragging = false;

  let offsetX = 0;

  let offsetY = 0;


  element.addEventListener(
    "pointerdown",
    event => {

      if (
        event.target.closest(
          "button, input, select"
        )
      ) {

        return;

      }


      dragging = true;


      element.setPointerCapture(
        event.pointerId
      );


      const rect =
        element.getBoundingClientRect();


      offsetX =
        event.clientX -
        rect.left;

      offsetY =
        event.clientY -
        rect.top;

    }
  );


  element.addEventListener(
    "pointermove",
    event => {

      if (!dragging) {
        return;
      }


      const stageRect =
        stage.getBoundingClientRect();


      let x =
        event.clientX -
        stageRect.left -
        offsetX;


      let y =
        event.clientY -
        stageRect.top -
        offsetY;


      x =
        clamp(
          x,
          0,
          stageRect.width -
          element.offsetWidth
        );


      y =
        clamp(
          y,
          0,
          stageRect.height -
          element.offsetHeight
        );


      element.style.left =
        `${x}px`;

      element.style.top =
        `${y}px`;


      fixtureState.x =
        Math.round(x);

      fixtureState.y =
        Math.round(y);

    }
  );


  element.addEventListener(
    "pointerup",
    () => {

      if (!dragging) {
        return;
      }

      dragging = false;

      saveState();

    }
  );


  element.addEventListener(
    "pointercancel",
    () => {

      dragging = false;

      saveState();

    }
  );

}


/* MASTER */

masterSlider.addEventListener(
  "input",
  () => {

    setMaster(
      masterSlider.value
    );

  }
);

addSliderIntervalHandlers(masterSlider);


/* SETTINGS */

function openSettings() {

  parCountInput.value =
    state.parCount;

  dimmerCountInput.value =
    state.dimmerCount;

  frameIntervalInput.value =
    state.frameInterval;

  schemeInput.value =
    state.scheme;

  settingsModal.classList.add(
    "open"
  );

}


function closeSettings() {

  settingsModal.classList.remove(
    "open"
  );

}


settingsBtn.addEventListener(
  "click",
  openSettings
);

closeSettingsBtn.addEventListener(
  "click",
  closeSettings
);

cancelSettingsBtn.addEventListener(
  "click",
  closeSettings
);


settingsModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      settingsModal
    ) {

      closeSettings();

    }

  }
);


/* SAVE SETTINGS */

saveSettingsBtn.addEventListener(
  "click",
  () => {

    const newParCount =
      clamp(
        Number(parCountInput.value) || 0,
        0,
        30
      );


    const newDimmerCount =
      clamp(
        Number(dimmerCountInput.value) || 0,
        0,
        32
      );


    const newScheme =
      schemeInput.value;

    const newFrameInterval =
      clamp(
        Number(frameIntervalInput.value) || 1000,
        25,
        5000
      );


    state.parCount =
      newParCount;

    state.dimmerCount =
      newDimmerCount;

    switchColorScheme(
      newScheme,
      false
    );

    state.frameInterval =
      newFrameInterval;

    setDMXFrameInterval(
      state.frameInterval
    );


    ensureFixtures();

    saveState();

    render();

    closeSettings();

  }
);


/* RESET */

resetBtn.addEventListener(
  "click",
  () => {

    const confirmed =
      confirm(
        "Weet je zeker dat je de volledige app wilt resetten?\n\nAlle lampen, adressen, posities en instellingen worden gewist."
      );


    if (!confirmed) {
      return;
    }


    localStorage.removeItem(
      STORAGE_KEY
    );


    location.reload();

  }
);


/* CONNECT */

connectBtn.addEventListener(
  "click",
  async () => {

    if (
      !window.dmx ||
      typeof window.dmx.connect !==
      "function"
    ) {

      alert(
        "DMX-controller is niet geladen."
      );

      return;

    }


    try {

      await window.dmx.connect();


      connectionStatus.classList.add(
        "connected"
      );

      statusText.textContent =
        "DMX verbonden";

      connectBtn.textContent =
        "Verbonden";

      connectBtn.disabled =
        true;


      /*
        Eén volledige update.
        Daarna neemt de vaste DMX-loop
        het over.
      */

      if (
        typeof window.dmx.sendAll ===
        "function"
      ) {

        window.dmx.sendAll();

      }

    } catch (error) {

      console.error(error);

      alert(
        "Verbinden met de DMX-interface is mislukt."
      );

    }

  }
);


/* INITIALIZE */

loadState();

setDMXFrameInterval(
  state.frameInterval
);

render();

</script>

</body>
</html>
