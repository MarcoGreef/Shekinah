<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Wat doe jij?</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #dfe3ff 0%, #b9bfdc 45%, #858ba8 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d1d1f;
    }

    /* =========================
       TELEFOON
    ========================= */

    .phone {
      position: relative;
      width: 390px;
      height: 820px;
      padding: 10px;
      background: #171717;
      border-radius: 48px;
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.35),
        inset 0 0 0 2px #343434;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 40px;
      background: #f7f7fb;
    }

    /* Zijknoppen */

    .silent-button {
      position: absolute;
      left: -4px;
      top: 130px;
      width: 4px;
      height: 30px;
      border-radius: 3px 0 0 3px;
      background: #252525;
    }

    .volume-up {
      position: absolute;
      left: -4px;
      top: 185px;
      width: 4px;
      height: 55px;
      border-radius: 3px 0 0 3px;
      background: #252525;
    }

    .volume-down {
      position: absolute;
      left: -4px;
      top: 250px;
      width: 4px;
      height: 55px;
      border-radius: 3px 0 0 3px;
      background: #252525;
    }

    .power-button {
      position: absolute;
      right: -4px;
      top: 205px;
      width: 4px;
      height: 80px;
      border-radius: 0 3px 3px 0;
      background: #252525;
    }

    /* Dynamic island */

    .dynamic-island {
      position: absolute;
      z-index: 20;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 125px;
      height: 32px;
      border-radius: 20px;
      background: #000;
    }

    .camera {
      position: absolute;
      right: 15px;
      top: 10px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #20252d;
      box-shadow: inset 0 0 0 2px #0c0c0c;
    }

    /* Statusbar */

    .statusbar {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .signal {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .signal span {
      display: block;
      width: 3px;
      border-radius: 1px;
      background: #111;
    }

    .signal span:nth-child(1) {
      height: 4px;
    }

    .signal span:nth-child(2) {
      height: 6px;
    }

    .signal span:nth-child(3) {
      height: 9px;
    }

    .signal span:nth-child(4) {
      height: 12px;
    }

    .wifi {
      font-size: 13px;
    }

    .battery {
      position: relative;
      width: 22px;
      height: 11px;
      border: 1.5px solid #111;
      border-radius: 3px;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 3px;
      width: 2px;
      height: 4px;
      border-radius: 0 1px 1px 0;
      background: #111;
    }

    .battery-level {
      position: absolute;
      left: 2px;
      top: 2px;
      bottom: 2px;
      width: 75%;
      border-radius: 1px;
      background: #111;
    }

    /* =========================
       APP
    ========================= */

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      flex-shrink: 0;
      padding: 68px 22px 18px;
      background: #f7f7fb;
    }

    header h1 {
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
    }

    header p {
      color: #777b88;
      font-size: 14px;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 18px 30px;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    /* =========================
       OVERZICHT
    ========================= */

    .situations {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 4px;
    }

    .situation-card {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 82px;
      padding: 16px 16px 16px 14px;
      border-radius: 20px;
      background: white;
      border: 1px solid #e8e8ee;
      box-shadow: 0 5px 14px rgba(30, 30, 50, 0.06);
      cursor: pointer;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .situation-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 20px rgba(30, 30, 50, 0.1);
    }

    .situation-card:active {
      transform: scale(0.98);
    }

    .situation-number {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 13px;
      border-radius: 12px;
      background: #eef0ff;
      color: #5262d5;
      font-size: 14px;
      font-weight: 800;
    }

    .situation-card h2 {
      flex: 1;
      padding-right: 8px;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
    }

    .arrow {
      color: #a2a5af;
      font-size: 25px;
      line-height: 1;
    }

    /* =========================
       DETAILPAGINA
    ========================= */

    .hidden {
      display: none !important;
    }

    .back-button {
      margin: 4px 0 12px;
      padding: 7px 0;
      border: none;
      background: transparent;
      color: #5262d5;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .detail-card {
      padding: 20px;
      border-radius: 24px;
      background: white;
      border: 1px solid #e7e7ed;
      box-shadow: 0 7px 20px rgba(30, 30, 50, 0.07);
    }

    .detail-card h2 {
      font-size: 21px;
      line-height: 1.25;
      letter-spacing: -0.3px;
      margin-bottom: 14px;
    }

    .detail-text {
      color: #555965;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .question {
      margin-bottom: 12px;
      font-size: 17px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .action-button {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dedfe7;
      border-radius: 14px;
      background: #f8f8fb;
      color: #20212a;
      text-align: left;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .action-button:hover {
      background: #f0f1ff;
      border-color: #cdd1ff;
    }

    .action-button:active {
      transform: scale(0.98);
    }

    /* =========================
       RESULTAAT
    ========================= */

    .result {
      margin-top: 4px;
    }

    .result-label {
      margin-bottom: 9px;
      color: #777b88;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .result-box {
      padding: 16px;
      border-radius: 16px;
      background: #eef0ff;
      border: 1px solid #dce0ff;
    }

    .result-box p {
      color: #30345b;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
    }

    .result-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .result-buttons button {
      flex: 1;
      min-height: 45px;
      padding: 8px 10px;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 700;
      cursor: pointer;
      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .result-buttons button:active {
      transform: scale(0.97);
    }

    .another-action {
      background: transparent;
      color: #5262d5;
    }

    .another-action:hover {
      background: #f1f2ff;
    }

    .next-action {
      background: #5262d5;
      color: white;
    }

    .next-action:hover {
      background: #4454c5;
    }

    /* =========================
       HOME INDICATOR
    ========================= */

    .home-indicator {
      position: absolute;
      z-index: 30;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 5px;
      border-radius: 10px;
      background: #111;
      opacity: 0.9;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 450px) {
      body {
        display: block;
        background: #f7f7fb;
      }

      .phone {
        width: 100vw;
        height: 100vh;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        background: #f7f7fb;
      }

      .screen {
        border-radius: 0;
      }

      .silent-button,
      .volume-up,
      .volume-down,
      .power-button {
        display: none;
      }

      .dynamic-island {
        top: 10px;
      }
    }

    @media (max-height: 850px) and (min-width: 451px) {
      .phone {
        height: 760px;
      }
    }
  </style>
</head>

<body>

  <div class="phone">

    <!-- Zijknoppen -->
    <div class="silent-button"></div>
    <div class="volume-up"></div>
    <div class="volume-down"></div>
    <div class="power-button"></div>

    <div class="screen">

      <!-- Dynamic Island -->
      <div class="dynamic-island">
        <div class="camera"></div>
      </div>

      <!-- Statusbar -->
      <div class="statusbar">
        <div id="currentTime">09:41</div>

        <div class="status-right">
          <div class="signal">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="wifi">⌁</div>

          <div class="battery">
            <div class="battery-level"></div>
          </div>
        </div>
      </div>

      <!-- App -->
      <div class="app">

        <header>
          <h1>Wat doe jij?</h1>
          <p>Kies een situatie.</p>
        </header>

        <main class="content">

          <!-- OVERZICHT -->
          <section id="overviewScreen">

            <div
              id="situationsContainer"
              class="situations"
            ></div>

          </section>

          <!-- DETAIL -->
          <section
            id="detailScreen"
            class="hidden"
          >

            <button
              class="back-button"
              onclick="showOverview()"
            >
              ← Alle situaties
            </button>

            <div class="detail-card">

              <h2 id="detailTitle"></h2>

              <div
                id="detailText"
                class="detail-text"
              ></div>

              <!-- ACTIES -->
              <div id="actionScreen">

                <div class="question">
                  Wat doe jij?
                </div>

                <div
                  id="actionsContainer"
                  class="actions"
                ></div>

              </div>

              <!-- RESULTAAT -->
              <div
                id="resultScreen"
                class="result hidden"
              >

                <div class="result-label">
                  Jouw keuze
                </div>

                <div class="result-box">
                  <p id="selectedActionText"></p>
                </div>

                <div class="result-buttons">

                  <button
                    class="another-action"
                    onclick="chooseAnotherAction()"
                  >
                    ← Andere actie kiezen
                  </button>

                  <button
                    class="next-action"
                    onclick="showNextSituation()"
                  >
                    Volgende situatie →
                  </button>

                </div>

              </div>

            </div>

          </section>

        </main>

      </div>

      <!-- Home indicator -->
      <div class="home-indicator"></div>

    </div>
  </div>


  <script>
    /* ==========================================
       SITUATIES
    ========================================== */

    const situaties = [

      {
        id: 1,

        titel:
          "Een gênante foto in de groepsapp",

        tekst:
          "In de groepsapp wordt een klasgenoot besproken die niet in de groep zit. Iemand stuurt een gênante foto van die persoon en iedereen begint grappige reacties te sturen.",

        acties: [
          "Je doet mee, want het is maar een grapje.",

          "Je zegt niets en kijkt alleen mee.",

          "Je stuurt iets om het gesprek een andere kant op te sturen.",

          "Je zegt dat je dit niet oké vindt."
        ]
      },


      {
        id: 2,

        titel:
          "Iemand wordt buitengesloten",

        tekst:
          "Tijdens de pauze zie je dat een klasgenoot steeds alleen staat. Een groepje leerlingen praat met elkaar, maar negeert deze persoon bewust.",

        acties: [
          "Je loopt door en bemoeit je er niet mee.",

          "Je maakt een grapje over de situatie.",

          "Je loopt naar de klasgenoot toe en vraagt of alles goed gaat.",

          "Je vraagt de groep waarom ze deze persoon buitensluiten."
        ]
      },


      {
        id: 3,

        titel:
          "Een vervelende opmerking",

        tekst:
          "Tijdens een les maakt iemand een gemene opmerking over het uiterlijk van een andere leerling. Een paar leerlingen lachen erom.",

        acties: [
          "Je lacht mee zodat je niet buiten de groep valt.",

          "Je zegt niets.",

          "Je probeert het onderwerp te veranderen.",

          "Je zegt dat de opmerking niet aardig is."
        ]
      },


      {
        id: 4,

        titel:
          "Een privébericht doorsturen",

        tekst:
          "Je krijgt een privébericht van een klasgenoot. Het bericht is duidelijk niet bedoeld voor andere mensen, maar iemand vraagt of je het wilt doorsturen naar de groepsapp.",

        acties: [
          "Je stuurt het meteen door.",

          "Je leest het maar doet verder niets.",

          "Je vraagt eerst toestemming aan de persoon die het stuurde.",

          "Je zegt dat je privéberichten niet wilt doorsturen."
        ]
      }

    ];


    /* ==========================================
       ELEMENTEN
    ========================================== */

    const overviewScreen =
      document.getElementById(
        "overviewScreen"
      );

    const detailScreen =
      document.getElementById(
        "detailScreen"
      );

    const situationsContainer =
      document.getElementById(
        "situationsContainer"
      );

    const detailTitle =
      document.getElementById(
        "detailTitle"
      );

    const detailText =
      document.getElementById(
        "detailText"
      );

    const actionsContainer =
      document.getElementById(
        "actionsContainer"
      );

    const actionScreen =
      document.getElementById(
        "actionScreen"
      );

    const resultScreen =
      document.getElementById(
        "resultScreen"
      );

    const selectedActionText =
      document.getElementById(
        "selectedActionText"
      );


    /* ==========================================
       HUIDIGE SITUATIE
    ========================================== */

    let huidigeSituatieIndex = 0;


    /* ==========================================
       SITUATIES WEERGEVEN
    ========================================== */

    function renderSituations() {

      situationsContainer.innerHTML = "";

      situaties.forEach(
        (situatie, index) => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "situation-card";

          card.innerHTML = `

            <div class="situation-number">
              ${index + 1}
            </div>

            <h2>
              ${situatie.titel}
            </h2>

            <div class="arrow">
              ›
            </div>

          `;

          card.addEventListener(
            "click",
            () => {
              showSituation(
                situatie.id
              );
            }
          );

          situationsContainer.appendChild(
            card
          );

        }
      );
    }


    /* ==========================================
       SITUATIE OPENEN
    ========================================== */

    function showSituation(id) {

      const index =
        situaties.findIndex(
          item => item.id === id
        );

      if (index === -1) {
        return;
      }

      huidigeSituatieIndex = index;

      const situatie =
        situaties[index];


      /* Titel en tekst */

      detailTitle.textContent =
        situatie.titel;

      detailText.textContent =
        situatie.tekst;


      /* Oude knoppen verwijderen */

      actionsContainer.innerHTML = "";


      /* Nieuwe actieknoppen maken */

      situatie.acties.forEach(
        (actie) => {

          const button =
            document.createElement(
              "button"
            );

          button.className =
            "action-button";

          button.textContent =
            actie;

          button.addEventListener(
            "click",
            () => {
              selectAction(
                actie
              );
            }
          );

          actionsContainer.appendChild(
            button
          );

        }
      );


      /* Schermen instellen */

      actionScreen.classList.remove(
        "hidden"
      );

      resultScreen.classList.add(
        "hidden"
      );

      overviewScreen.classList.add(
        "hidden"
      );

      detailScreen.classList.remove(
        "hidden"
      );


      /* Scroll naar boven */

      document
        .querySelector(".content")
        .scrollTop = 0;
    }


    /* ==========================================
       ACTIE KIEZEN
    ========================================== */

    function selectAction(actie) {

      selectedActionText.textContent =
        actie;

      actionScreen.classList.add(
        "hidden"
      );

      resultScreen.classList.remove(
        "hidden"
      );


      resultScreen.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }


    /* ==========================================
       ANDERE ACTIE KIEZEN
    ========================================== */

    function chooseAnotherAction() {

      resultScreen.classList.add(
        "hidden"
      );

      actionScreen.classList.remove(
        "hidden"
      );
    }


    /* ==========================================
       VOLGENDE SITUATIE
    ========================================== */

    function showNextSituation() {
        showOverview();
    }


    /* ==========================================
       TERUG NAAR OVERZICHT
    ========================================== */

    function showOverview() {

      detailScreen.classList.add(
        "hidden"
      );

      overviewScreen.classList.remove(
        "hidden"
      );


      document
        .querySelector(".content")
        .scrollTop = 0;
    }


    /* ==========================================
       TIJD IN STATUSBAR
    ========================================== */

    function updateTime() {

      const now =
        new Date();

      const hours =
        String(
          now.getHours()
        ).padStart(
          2,
          "0"
        );

      const minutes =
        String(
          now.getMinutes()
        ).padStart(
          2,
          "0"
        );

      document.getElementById(
        "currentTime"
      ).textContent =
        `${hours}:${minutes}`;
    }


    /* ==========================================
       START
    ========================================== */

    renderSituations();

    updateTime();

    setInterval(
      updateTime,
      30000
    );

  </script>

</body>
</html>
